name: Compilar APK de Odin

on:
  push:
    branches: [odin-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Armar el juego y copiarlo al proyecto Android
        run: npm run sync

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Odin-vikingo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Odin-vikingo-apk
          path: Odin-vikingo.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: odin-v${{ github.run_number }}
          name: Odin vikingo (versión ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: Odin-vikingo.apk
          make_latest: true
          body: |
            APK de Odin con modo Bluetooth para jugar cerca sin internet.
            Descargá **Odin-vikingo.apk** desde el celular e instalalo (permití "instalar apps de origen desconocido").
