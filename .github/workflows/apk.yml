name: Compilar APK de Odin

on:
  push:
    branches: [odin-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (ya viene instalado en el runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME" | head

      - name: Instalar dependencias
        run: npm ci

      - name: Armar el juego y copiarlo al proyecto Android
        run: npm run sync

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Mostrar el error de compilación
        if: failure()
        run: |
          grep -n -E -A14 "What went wrong|error:|Could not (find|resolve)" build.log | head -80 > err.txt || true
          [ -s err.txt ] || tail -60 build.log > err.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' err.txt | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Gradle::${msg}"

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Odin-vikingo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Odin-vikingo-apk
          path: Odin-vikingo.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: odin-v${{ github.run_number }}
          name: Odin vikingo (versión ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: Odin-vikingo.apk
          make_latest: true
          body: |
            APK de Odin con modo Bluetooth para jugar cerca sin internet.
            Descargá **Odin-vikingo.apk** desde el celular e instalalo (permití "instalar apps de origen desconocido").
